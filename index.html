<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#111;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .game-container{
      width:100%;
      max-width:500px;
      text-align:center;
    }

    h1{
      margin-bottom:10px;
      font-size:2rem;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      gap:10px;
    }

    .score{
      font-size:1.2rem;
      font-weight:bold;
    }

    button{
      padding:10px 16px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#22c55e;
      color:white;
      font-size:1rem;
      font-weight:bold;
    }

    button:hover{
      opacity:0.9;
    }

    canvas{
      width:100%;
      aspect-ratio:1/1;
      background:#1e1e1e;
      border:3px solid #333;
      border-radius:12px;
      touch-action:none;
    }

    .controls{
      margin-top:20px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
      max-width:260px;
      margin-inline:auto;
    }

    .controls button{
      background:#333;
      height:60px;
      font-size:1.5rem;
    }

    .empty{
      visibility:hidden;
    }

    .info{
      margin-top:15px;
      color:#aaa;
      font-size:0.95rem;
    }

    @media (max-width:500px){
      h1{
        font-size:1.6rem;
      }

      .controls button{
        height:55px;
      }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>🐍 Snake Game</h1>

    <div class="top-bar">
      <div class="score">Score: <span id="score">0</span></div>
      <button onclick="restartGame()">Restart</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
      <div class="empty"></div>
      <button onclick="changeDirection('up')">⬆️</button>
      <div class="empty"></div>

      <button onclick="changeDirection('left')">⬅️</button>
      <button onclick="changeDirection('down')">⬇️</button>
      <button onclick="changeDirection('right')">➡️</button>
    </div>

    <div class="info">
      Use keyboard arrows or touch buttons on mobile
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");

    const gridSize = 20;
    const tileCount = 20;

    canvas.width = 400;
    canvas.height = 400;

    let snake = [
      { x: 10, y: 10 }
    ];

    let food = {
      x: 5,
      y: 5
    };

    let dx = 0;
    let dy = 0;

    let score = 0;
    let speed = 120;
    let gameLoop;

    function drawGame() {
      clearCanvas();
      moveSnake();
      drawFood();
      drawSnake();
      checkCollision();
    }

    function clearCanvas() {
      ctx.fillStyle = "#1e1e1e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#4ade80";

        ctx.fillRect(
          part.x * gridSize,
          part.y * gridSize,
          gridSize - 2,
          gridSize - 2
        );
      });
    }

    function moveSnake() {
      const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
      };

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        generateFood();

        // Increase speed slightly
        if (speed > 60) {
          speed -= 3;
          restartLoop();
        }

      } else {
        snake.pop();
      }
    }

    function drawFood() {
      ctx.fillStyle = "#ef4444";

      ctx.fillRect(
        food.x * gridSize,
        food.y * gridSize,
        gridSize - 2,
        gridSize - 2
      );
    }

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };

      // Prevent food on snake
      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
        }
      });
    }

    function checkCollision() {
      const head = snake[0];

      // Wall collision
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
      ) {
        gameOver();
      }

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (
          head.x === snake[i].x &&
          head.y === snake[i].y
        ) {
          gameOver();
        }
      }
    }

    function gameOver() {
      clearInterval(gameLoop);

      setTimeout(() => {
        alert("Game Over! Score: " + score);
      }, 100);
    }

    function restartGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      speed = 120;

      scoreEl.textContent = score;

      generateFood();

      restartLoop();
    }

    function restartLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(drawGame, speed);
    }

    function changeDirection(direction) {

      switch(direction) {
        case "up":
          if (dy === 1) return;
          dx = 0;
          dy = -1;
          break;

        case "down":
          if (dy === -1) return;
          dx = 0;
          dy = 1;
          break;

        case "left":
          if (dx === 1) return;
          dx = -1;
          dy = 0;
          break;

        case "right":
          if (dx === -1) return;
          dx = 1;
          dy = 0;
          break;
      }
    }

    // Keyboard Controls
    document.addEventListener("keydown", (e) => {

      switch(e.key) {
        case "ArrowUp":
          changeDirection("up");
          break;

        case "ArrowDown":
          changeDirection("down");
          break;

        case "ArrowLeft":
          changeDirection("left");
          break;

        case "ArrowRight":
          changeDirection("right");
          break;
      }
    });

    // Swipe Controls
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener("touchend", (e) => {
      let touchEndX = e.changedTouches[0].clientX;
      let touchEndY = e.changedTouches[0].clientY;

      let dxTouch = touchEndX - touchStartX;
      let dyTouch = touchEndY - touchStartY;

      if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
        if (dxTouch > 0) {
          changeDirection("right");
        } else {
          changeDirection("left");
        }
      } else {
        if (dyTouch > 0) {
          changeDirection("down");
        } else {
          changeDirection("up");
        }
      }
    });

    // Start game
    restartGame();
  </script>

</body>
</html>
